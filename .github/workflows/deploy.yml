name: CI/CD Pipeline - Task Manager

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1 : VERIFICATION DU CODE & TESTS
  # ==========================================
  test-and-lint:
    name: Verification & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Verification Backend ---
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend
        run: |
          cd backend
          mvn clean package -DskipTests

      # --- Verification Frontend ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      # --- Verification Mobile ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Check Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

  # JOB 2 : DEPLOIEMENT MOBILE WEB SUR FIREBASE

  deploy-mobile-firebase:
    name: Deploy Mobile Web to Firebase Hosting
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter Web
        run: |
          cd mobile
          flutter pub get
          flutter build web --release

      - name: Deploy Mobile Web to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          entryPoint: ./mobile